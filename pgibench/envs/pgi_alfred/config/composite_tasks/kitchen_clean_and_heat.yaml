# Kitchen composite task: Clean an apple and heat a potato
name: "kitchen_clean_and_heat"
description: "Clean an apple and place it on the counter, then slice and heat a potato and place it on a plate"

scene:
  room_type: "Kitchen"
  scene_num: null  # Auto-select

instruction: "clean the {obj_0} and put it in {recep_0}, then slice the {obj_1}, heat it, and put it in {recep_1}"

subtasks:
  # Subtask 1: Clean apple and place on counter
  - task_type: "pick_clean_then_place_in_recep"
    object: "Apple"
    parent: "CounterTop"
    sliced: false

  # Subtask 2: Slice and heat potato, place on plate
  - task_type: "pick_heat_then_place_in_recep"
    object: "Potato"
    parent: "Plate"
    sliced: true

completion:
  mode: "all"  # All subtasks must succeed
