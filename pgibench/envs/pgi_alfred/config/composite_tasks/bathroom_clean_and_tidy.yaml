  - task_type: "pick_clean_then_place_in_recep"
    object: "Mug"
    parent: "Shelf"
    sliced: false

  # Subtask 2: Place towel on bathtub
  - task_type: "pick_and_place_simple"
    object: "HandTowel"
    parent: "Bathtub"
    sliced: false

completion:
  mode: "all"
