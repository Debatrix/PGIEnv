instructions:
  macro: After a long day, I'd love to settle in and unwind with a bit of reading
    - could you switch on the floor lamp, set the remote control on the armchair,
    drop the key chain on the dresser, set the candle on the dining table, open the
    drawer, and bring the laptop over to the floor lamp so I can read in the light?
    That way, the living room feels calm and everything is in its place for a relaxing
    evening.
  micro: Turn on the floor lamp; put the remote control on the armchair; put the key
    chain on the dresser; put the candle on the dining table; open the drawer; bring
    the laptop to the floor lamp to read it.
