instructions:
  macro: With dinner prep underway, I could use a hand getting a few things in place
    and the kitchen tidied -- would you slice the tomato onto the side table, warm
    the potato and set it on the side table, pop the apple in to chill on the counter,
    rinse the mug and set it on the counter, and set an egg out on the counter? It
    makes for a ready-to-eat spread and a clean mug without a second trip.
  micro: Slice the tomato and put it on the side table; heat the potato in the microwave
    and put it on the side table; cool the apple in the fridge and put it on the counter
    top; clean the mug at the sink and put it on the counter top; put the egg on the
    counter top.
