instructions:
  macro: I'm laying out the kitchen counter as a single cooking-prep station. Could
    you heat the potato in the microwave and set it on the counter, chill the cup
    in the fridge and bring it to the counter, rinse the mug at the sink and leave
    it on the counter, and slice the tomato onto the plate? That way every ingredient
    and tool is gathered in one spot and ready when I start cooking.
  micro: Heat the potato in the microwave and put it on the counter top; cool the
    cup in the fridge and put it on the counter top; rinse the mug at the sink and
    put it on the counter top; slice the tomato and put it on the plate.
