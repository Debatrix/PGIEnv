instructions:
  macro: After a long stretch getting the kitchen ready, I'd love a warm, prepped
    bite — could you heat the apple in the microwave and bring it over to the dining
    table, slice the potato onto the counter top, and lay the egg and the butter knife
    out on the counter as well? That way the cooked fruit, the sliced veg, and a utensil
    are all set to throw together a quick meal.
  micro: Heat the apple in the microwave and put it on the dining table; slice the
    potato and put it on the counter top; put the egg on the counter top; put the
    butter knife on the counter top.
