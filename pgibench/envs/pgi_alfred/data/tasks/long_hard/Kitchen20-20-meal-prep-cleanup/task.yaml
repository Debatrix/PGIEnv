task_id: Kitchen20-20-meal-prep-cleanup
task_type: composite
eval_set: long_hard
instructions:
  macro: After a busy morning, I'd love to get a little meal prepped and the kitchen
    tidied in one go - would you slice the tomato onto the dining table, warm the
    potato on the counter, chill the apple and bring it to the dining table, rinse
    the mug and set it on the counter, and crack the egg into the bowl and set the
    bowl on the counter? That way everything's ready to serve and the dishes are put
    away.
  micro: Slice the tomato and put it on the dining table; heat the potato in the microwave
    and put it on the counter top; chill the apple in the fridge and put it on the
    dining table; rinse the mug at the sink and put it on the counter top; put the
    egg into the bowl and set the bowl on the counter top.
