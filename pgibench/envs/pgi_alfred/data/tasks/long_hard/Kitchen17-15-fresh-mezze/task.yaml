instructions:
  macro: We're having friends over for a light mezze spread, so I'd like to get everything
    laid out on the counter. Could you slice the tomato and the lettuce onto a plate,
    warm the potato in the microwave and bring it over, then fold the egg into the
    pan and set it out beside a fork? That way everyone can just graze.
  micro: Slice the tomato and put it on the plate; slice the lettuce and put it on
    the plate; heat the potato in the microwave and put it on the counter top; put
    the egg in the pan and put the pan on the counter top; put the fork on the counter
    top.
