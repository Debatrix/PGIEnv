task_id: Kitchen24-27-meal-prep-cleanup
task_type: composite
eval_set: long_hard
instructions:
  macro: After a busy morning in the kitchen, I would love to get a light meal prepped
    and the place tidied up. Could you heat the potato in the microwave and set it
    on the counter top, chill the apple in the fridge and leave it on the counter
    too, rinse the mug at the sink and set it on the counter top, put the lettuce
    on the counter top, and slice the tomato onto the dining table? That way everything
    is ready to serve and the cleanup is done in one go.
  micro: Heat the potato in the microwave and put it on the counter top; cool the
    apple in the fridge and put it on the counter top; rinse the mug at the sink and
    put it on the counter top; put the lettuce on the counter top; slice the tomato
    and put it on the dining table.
