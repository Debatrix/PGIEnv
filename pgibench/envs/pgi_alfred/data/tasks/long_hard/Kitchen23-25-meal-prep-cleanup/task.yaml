instructions:
  macro: After a busy morning, I'd love to get a little meal prepped and the kitchen
    tidied in one go - could you slice the tomato and set it on the counter, warm
    the potato and leave it on the counter, chill the apple and bring it to the dining
    table, rinse the mug and set it on the dining table, and move the egg over to
    the dining table as well? That way everything's ready to serve and the dishes
    are put away.
  micro: Slice the tomato and put it on the counter top; heat the potato in the microwave
    and put it on the counter top; chill the apple in the fridge and put it on the
    dining table; rinse the mug at the sink and put it on the dining table; pick up
    the egg and put it on the dining table.
