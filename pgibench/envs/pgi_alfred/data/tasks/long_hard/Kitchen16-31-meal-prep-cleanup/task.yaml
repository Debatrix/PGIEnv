instructions:
  macro: After a long morning in the kitchen, I'd love to get a simple meal laid out
    and the place tidied — could you heat the potato in the microwave and set it on
    the counter top, slice the tomato and add it to the counter too, chill the apple
    in the fridge and bring it out to the dining table, rinse the mug at the sink
    and set it on the counter top, then serve the egg in a bowl on the counter? That
    way everything's prepped and ready to eat with the table set.
  micro: Heat the potato in the microwave and put it on the counter top; slice the
    tomato and put it on the counter top; chill the apple in the fridge and put it
    on the dining table; rinse the mug at the sink and put it on the counter top;
    put the egg in the bowl and put the bowl on the counter top.
