instructions:
  macro: After a busy morning, I'm putting together a breakfast spread, so could you
    heat the potato and bring it to the dining table, chill the apple and set it on
    the counter top, rinse the mug and leave it on the counter top, slice the tomato
    onto the counter top, and put the egg into the bowl and set the bowl on the counter
    top? That way, everything is ready to sit down and eat.
  micro: Heat the potato in the microwave and put it on the dining table; chill the
    apple in the fridge and put it on the counter top; rinse the mug at the sink and
    put it on the counter top; slice the tomato and put it on the counter top; put
    the egg into the bowl and put the bowl on the counter top.
