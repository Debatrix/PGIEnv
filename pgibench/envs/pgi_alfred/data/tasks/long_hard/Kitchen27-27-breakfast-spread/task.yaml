instructions:
  macro: Breakfast is on its way and I'd love the spread laid out — could you rest
    an egg on the counter top, set a fork on the counter top, heat the potato in the
    microwave and set it on the counter top, chill the tomato onto a plate, rinse
    the mug and set it on the dining table, and slice the lettuce onto that plate?
    That way everything's ready to sit down and eat.
  micro: Put the egg on the counter top; put the fork on the counter top; heat the
    potato in the microwave and put it on the counter top; chill the tomato in the
    fridge and put it on the plate; rinse the mug at the sink and put it on the dining
    table; slice the lettuce and put it on the plate.
