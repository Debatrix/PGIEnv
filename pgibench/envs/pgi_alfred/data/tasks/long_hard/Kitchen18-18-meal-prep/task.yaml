instructions:
  macro: After a busy morning, I wanted to put together a light breakfast spread.
    Could you slice the tomato and set the slices on the counter top, heat the potato
    in the microwave and bring it to the dining table, chill the apple in the fridge
    and bring it to the counter top, serve an egg in a bowl on the dining table, and
    rinse the mug at the sink and set it on the counter top? That way everything is
    laid out and ready to eat.
  micro: Slice the tomato and put it on the counter top; heat the potato in the microwave
    and put it on the dining table; cool the apple in the fridge and put it on the
    counter top; put the egg in the bowl and put the bowl on the dining table; rinse
    the mug at the sink and put it on the counter top.
