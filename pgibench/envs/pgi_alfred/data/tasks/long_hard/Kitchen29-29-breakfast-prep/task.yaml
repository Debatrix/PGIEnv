instructions:
  macro: With a quick meal to throw together, could you get the counter ready — heat
    the egg in the microwave, chill the mug in the fridge, rinse the cup at the sink,
    and slice the lettuce, then set them all out on the counter top? That way everything's
    prepped and a clean cup is right there when you need it.
  micro: Heat the egg in the microwave and put it on the counter top; cool the mug
    in the fridge and put it on the counter top; rinse the cup at the sink and put
    it on the counter top; slice the lettuce and put it on the counter top.
