instructions:
  macro: While tidying up the bathroom, could you gather the scattered toiletries
    and set them on the counter top — the candle, the bar of soap, the towel, and
    the scrub brush? It keeps everything in one convenient spot for the next person.
  micro: Pick up the candle and put it on the counter top; pick up the soap bar and
    put it on the counter top; pick up the towel and put it on the counter top; pick
    up the scrub brush and put it on the counter top.
